name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  web:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/code/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  java:
    name: Java CCP checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Compile
        run: javac -d out -cp CCP/lib/json-20240303.jar CCP/*.java

      - name: Self-test
        run: java -cp "out:CCP/lib/json-20240303.jar" CCP.CCPSelfTest
